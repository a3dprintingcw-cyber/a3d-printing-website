# A3D Printing back office
#
# Everything new lives on app.a3dprinting.com:
#
#   app.a3dprinting.com/admin   the back office
#   app.a3dprinting.com/api/*   intake, uploads, webhooks, analytics beacon
#
# The marketing site stays on GitHub Pages with its DNS untouched.

name = "a3d-backoffice"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Deploys run from GitHub Actions on every push to main, so the live Worker
# always matches what is in this repo.
account_id = "c169592ab9e6b197cfe88e7cd8836986"

[observability]
enabled = true

# The Worker lives on its own subdomain so the marketing site's DNS never
# has to change: app.a3dprinting.com serves /admin and /api.
routes = [
  { pattern = "app.a3dprinting.com", custom_domain = true },
]

# Sentoo warns that webhooks can be late, duplicated or missing, so we also
# poll the payments we are waiting on.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "a3d"
database_id = "8c3370c7-0de0-4d53-9674-0b675de925ad"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "a3d-uploads"

[vars]
ADMIN_EMAIL = "a3dprinting.cw@gmail.com"
BUSINESS_NAME = "A3D Printing"
CURRENCY = "XCG"
PUBLIC_ORIGIN = "https://a3dprinting.com"
MAX_UPLOAD_MB = "50"
# Cloudflare Access team domain, e.g. "a3dprinting" for a3dprinting.cloudflareaccess.com
CF_ACCESS_TEAM = "a3dprinting"
CF_ACCESS_AUD = "cb630e81ffe72821523d4d21aa30806b056d68cc2c3feee4865ffedb7cf314ca"
# sandbox until Sentoo issues production credentials
SENTOO_BASE = "https://api.sandbox.sentoo.io"
SENTOO_MODE = "mock"

# Secrets, set with `wrangler secret put NAME` (never in this file):
#   SENTOO_MERCHANT   merchant uid from the Sentoo portal
#   SENTOO_SECRET     value for the X-SENTOO-SECRET header
#   QBO_CLIENT_ID     Intuit app, phase 2
#   QBO_CLIENT_SECRET Intuit app, phase 2
#   QBO_REFRESH_TOKEN Intuit OAuth, phase 2
#   GMAIL_CLIENT_ID     Google Cloud OAuth client
#   GMAIL_CLIENT_SECRET
#   GMAIL_REFRESH_TOKEN one-time consent by Adrian, then it refreshes itself
